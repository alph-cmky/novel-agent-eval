[project]
name = "novel-agent-eval"
version = "0.1.0"
description = "Evaluation harness for long-form Agent writing systems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "alph-cmky", email = "64311644+alph-cmky@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "huggingface-hub>=0.24.0",
    "novel-agent",
    "openai>=3.0.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
novel-agent = { git = "https://github.com/alph-cmky/novel-agent.git" }

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: 集成测试，需要真实 LLM API（无 key 时 skip）",
]

[tool.ruff]
# vendor/constory 为官方原样复制的第三方代码（仅加来源注释），不做 lint
extend-exclude = ["novel_agent_eval/vendor"]

[tool.ruff.lint]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
